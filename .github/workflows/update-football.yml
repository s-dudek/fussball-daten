name: Fußball-Daten aktualisieren

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Fußballdaten abrufen und speichern
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python3 scripts/update_football.py

      - name: Änderungen committen (nur wenn es welche gibt)
        run: |
          git config user.name "football-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/football.json
          git diff --staged --quiet || git commit -m "Fußballdaten aktualisiert"
          git push
